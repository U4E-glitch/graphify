name: qiyas-release

on:
  push:
    tags:
      - "qiyas-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.3"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: qiyas
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Determine version and rename APK
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="v${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#qiyas-}"
          fi
          cp qiyas/app/build/outputs/apk/release/app-release.apk "qiyas-${VERSION}.apk"
          echo "APK_NAME=qiyas-${VERSION}.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=qiyas-${VERSION}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Qiyas ${{ env.RELEASE_TAG }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
