name: qiyas-release

on:
  push:
    tags:
      - "qiyas-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.3"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      # Preferred: short passphrase that decrypts keystore/upload-bundle.enc
      UPLOAD_PASSPHRASE: ${{ secrets.QIYAS_UPLOAD_KEY || vars.QIYAS_UPLOAD_KEY }}
      # Legacy fallback: keystore itself as base64 + separate password secret
      UPLOAD_KEY_B64: ${{ secrets.QIYAS_UPLOAD_KEYSTORE_B64 || vars.QIYAS_UPLOAD_KEYSTORE_B64 }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.QIYAS_UPLOAD_KEYSTORE_PASSWORD || vars.QIYAS_UPLOAD_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Upload-key diagnostics
        run: |
          echo "passphrase secret set: ${{ env.UPLOAD_PASSPHRASE != '' }}"
          echo "legacy b64 secret set: ${{ env.UPLOAD_KEY_B64 != '' }}"
          echo "legacy password secret set: ${{ env.UPLOAD_KEY_PASSWORD != '' }}"

      # Sideload APK: signed with the repo keystore so existing Obtainium
      # installs keep their update chain.
      - name: Build signed release APK (sideload channel)
        working-directory: qiyas
        run: ./gradlew --no-daemon :app:assembleRelease

      # Play AAB: signed with the PRIVATE upload key. The keystore ships
      # encrypted in the repo; the short passphrase secret unlocks it.
      - name: Build Play App Bundle
        if: ${{ env.UPLOAD_PASSPHRASE != '' || (env.UPLOAD_KEY_B64 != '' && env.UPLOAD_KEY_PASSWORD != '') }}
        working-directory: qiyas
        env:
          QIYAS_KEYSTORE: /tmp/qiyas-upload.jks
          QIYAS_KEY_ALIAS: qiyas-upload
        run: |
          set -euo pipefail
          if [ -n "$UPLOAD_PASSPHRASE" ]; then
            PHRASE=$(printf '%s' "$UPLOAD_PASSPHRASE" | tr -d ' \t\r\n')
            openssl enc -d -aes-256-cbc -pbkdf2 -pass "pass:$PHRASE" \
              -in keystore/upload-bundle.enc | tar -x -C /tmp
            PASSWORD=$(cat /tmp/qiyas-upload-password.txt)
          else
            echo "$UPLOAD_KEY_B64" | tr -d ' \t\r\n' | base64 -d > /tmp/qiyas-upload.jks
            PASSWORD="$UPLOAD_KEY_PASSWORD"
          fi
          keytool -list -keystore /tmp/qiyas-upload.jks -storepass "$PASSWORD" -alias qiyas-upload > /dev/null \
            && echo "upload keystore verified OK" || { echo "keystore/passphrase verification FAILED"; exit 1; }
          QIYAS_KEYSTORE_PASSWORD="$PASSWORD" QIYAS_KEY_PASSWORD="$PASSWORD" ./gradlew --no-daemon :app:bundleRelease
          rm -f /tmp/qiyas-upload.jks /tmp/qiyas-upload-password.txt

      - name: Determine version and collect artifacts
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="v${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#qiyas-}"
          fi
          cp qiyas/app/build/outputs/apk/release/app-release.apk "qiyas-${VERSION}.apk"
          FILES="qiyas-${VERSION}.apk"
          if [ -f qiyas/app/build/outputs/bundle/release/app-release.aab ]; then
            cp qiyas/app/build/outputs/bundle/release/app-release.aab "qiyas-${VERSION}-play.aab"
            FILES="$FILES qiyas-${VERSION}-play.aab"
          else
            echo "NOTE: upload-key secret not configured — AAB skipped."
          fi
          echo "RELEASE_TAG=qiyas-${VERSION}" >> "$GITHUB_ENV"
          {
            echo "RELEASE_FILES<<EOF"
            for f in $FILES; do echo "$f"; done
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Qiyas ${{ env.RELEASE_TAG }}
          files: ${{ env.RELEASE_FILES }}
          generate_release_notes: true
