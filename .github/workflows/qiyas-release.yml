name: qiyas-release

on:
  push:
    tags:
      - "qiyas-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: qiyas
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK to versioned filename
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          cp qiyas/app/build/outputs/apk/release/app-release.apk "qiyas-${TAG#qiyas-}.apk"
          echo "APK_NAME=qiyas-${TAG#qiyas-}.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/qiyas-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Qiyas ${{ github.ref_name }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: true

      - name: Upload APK artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/qiyas-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: qiyas-apk
          path: ${{ env.APK_NAME }}
